org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=36

# Required for the androidx.test runner used by `connectedDebugAndroidTest`.
# AndroidX is *only* on the `androidTestImplementation` classpath — the release
# APK has no AndroidX dependency. This flag just tells AGP not to refuse the
# androidx-namespaced libs at build time.
android.useAndroidX=true
